name: Fork macOS checks for canceled drag
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PR_SHA: adaf2665d92fb40c0a9a59568b9237edb015fca2
  CUA_TELEMETRY: '0'
  DO_NOT_TRACK: '1'
jobs:
  browser:
    name: macOS 26 Chrome and Edge E2E
    runs-on: macos-26
    timeout-minutes: 180
    env:
      CUA_E2E_SOURCE_SHA: adaf2665d92fb40c0a9a59568b9237edb015fca2
      CUA_E2E_INTERNAL_LANE: browser
      CUA_E2E_RETRY_ONCE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: adaf2665d92fb40c0a9a59568b9237edb015fca2
          persist-credentials: false
      - name: Verify PR source and hosted environment
        run: |
          test "$(git rev-parse HEAD)" = "$PR_SHA"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cua-driver-target-browser" >> "$GITHUB_ENV"
          export CUA_MACOS_HOSTED_PROBE_DIR="$RUNNER_TEMP/cua-macos-hosted-probe"
          mkdir -p "$CUA_MACOS_HOSTED_PROBE_DIR"
          scripts/ci/macos/probe-hosted-runner.sh
      - name: Install missing tools
        run: |
          for tool in ffmpeg jq; do
            if ! command -v "$tool" >/dev/null; then brew install "$tool"; fi
          done
      - name: Run upstream hosted browser E2E
        run: scripts/ci/macos/run-hosted-rust-e2e.sh
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: macos-browser-evidence
          path: |
            artifacts/cua-driver
            ${{ runner.temp }}/cua-macos-hosted-probe
          if-no-files-found: warn
          retention-days: 7
