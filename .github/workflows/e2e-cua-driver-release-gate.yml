name: Verify canceled drag in the fork
on:
  push:
    branches: [ci/verify-canceled-drag]
    paths: [.github/workflows/e2e-cua-driver-release-gate.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  linux:
    uses: ./.github/workflows/e2e-rust-linux.yml
    with:
      ref: bcab95eb26f641ea2a90c5ac54239e0ffb732bb7
  windows:
    uses: ./.github/workflows/e2e-rust-windows.yml
    with:
      ref: bcab95eb26f641ea2a90c5ac54239e0ffb732bb7
  browsers:
    uses: ./.github/workflows/e2e-rust-standalone-browsers.yml
    with:
      ref: bcab95eb26f641ea2a90c5ac54239e0ffb732bb7
  macos:
    uses: ./.github/workflows/e2e-rust-macos.yml
    with:
      source_sha: ${{ github.sha }}
