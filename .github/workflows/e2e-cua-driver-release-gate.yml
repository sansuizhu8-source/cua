name: Fork macOS desktop checks for canceled drag

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PR_SHA: adaf2665d92fb40c0a9a59568b9237edb015fca2
  CUA_TELEMETRY: '0'
  DO_NOT_TRACK: '1'

jobs:
  desktop:
    name: macOS 26 ${{ matrix.lane }}
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: [shared, native, capture]
    env:
      CUA_E2E_SOURCE_SHA: adaf2665d92fb40c0a9a59568b9237edb015fca2
      CUA_E2E_INTERNAL_LANE: ${{ matrix.lane }}
      CUA_E2E_RETRY_ONCE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: adaf2665d92fb40c0a9a59568b9237edb015fca2
          persist-credentials: false
      - name: Verify PR source and hosted environment
        run: |
          test "$(git rev-parse HEAD)" = "$PR_SHA"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cua-driver-target-$CUA_E2E_INTERNAL_LANE" >> "$GITHUB_ENV"
          export CUA_MACOS_HOSTED_PROBE_DIR="$RUNNER_TEMP/cua-macos-hosted-probe"
          mkdir -p "$CUA_MACOS_HOSTED_PROBE_DIR"
          scripts/ci/macos/probe-hosted-runner.sh
      - name: Install missing test dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          # The capture lane's published-catalog perception row drives the
          # Tk visual-only canvas fixture. Hosted Homebrew Python ships
          # without _tkinter, so add the matching python-tk formula there.
          if [[ "${CUA_E2E_INTERNAL_LANE}" == capture ]] \
              && ! python3 -c 'import tkinter' >/dev/null 2>&1; then
            python_minor="$(python3 -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')"
            missing+=("python-tk@${python_minor}")
          fi
          if ((${#missing[@]})); then
            brew install "${missing[@]}"
          fi
          if [[ "${CUA_E2E_INTERNAL_LANE}" == capture ]]; then
            python3 -c 'import tkinter; print("Tk", tkinter.TkVersion)'
          fi

      - name: Run hosted macOS lane
        shell: bash
        run: scripts/ci/macos/run-hosted-rust-e2e.sh

      - name: Report flaky cases
        if: always()
        shell: bash
        run: scripts/ci/summarize-flaky-cases.sh artifacts/cua-driver >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hosted macOS lane evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: rust-macos-hosted-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cua-driver
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
